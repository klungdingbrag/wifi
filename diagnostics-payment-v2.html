<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Nusantara WiFi — Payment Integrity V2</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;color:#18212f;background:#f6f8fb}h1{margin-bottom:6px}.sub{color:#64748b;margin-top:0}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 4px 18px #00000008}.pass{color:#15803d;font-weight:700}.fail{color:#b91c1c;font-weight:700}.warn{color:#a16207;font-weight:700}.muted{color:#64748b}button{border:0;border-radius:10px;padding:11px 16px;background:#172033;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow:auto;background:#f8fafc;padding:14px;border-radius:10px}</style></head>
<body><h1>Payment Integrity Test V2</h1><p class="sub">Read-only. Tidak membuat, mengubah, atau menghapus transaksi. Diagnostics V2.</p><button id="run">Jalankan pemeriksaan</button><div id="out"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbw3xXv41xKe2L2rg3qIaXp_p5wzeSjvotCVrUMgT7SWJiDKBC4rv6DBLeHUkBRsYcQSZg/exec';const out=document.getElementById('out');
async function get(action){const r=await fetch(API_URL+'?action='+encodeURIComponent(action)+'&_='+Date.now(),{cache:'no-store'});const t=await r.text();const j=JSON.parse(t);if(!r.ok||j.success===false)throw Error(j.message||'Request gagal');return j.data;}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function findNameField_(obj){const keys=['Nama','Nama Pelanggan','Nama Customer','Customer','Pelanggan','Nama Pelanggan/Warga'];for(const key of keys){if(Object.prototype.hasOwnProperty.call(obj,key))return {key:key,value:obj[key]??''};}const key=Object.keys(obj).find(k=>/nama|pelanggan|customer/i.test(k));return key?{key:key,value:obj[key]??''}:null;}
async function run(){out.innerHTML='<div class="card">Memeriksa...</div>';try{const d=await get('getInitialData');const bills=d.tagihan||[],payments=d.pembayaran||[];const billById=new Map(bills.map(b=>[String(b['ID Tagihan']),b]));const paymentIds=new Set(),paymentByBill=new Map(),critical=[],warnings=[],nameFields=new Set();
for(const p of payments){const pid=String(p['ID Pembayaran']||''),bid=String(p['ID Tagihan']||'');const nf=findNameField_(p);if(nf)nameFields.add(nf.key);if(!pid)critical.push('Pembayaran tanpa ID pembayaran.');if(paymentIds.has(pid))critical.push('Duplicate ID Pembayaran: '+pid);paymentIds.add(pid);if(!bid)critical.push('Pembayaran '+pid+' tanpa ID Tagihan.');const b=billById.get(bid);if(!b){critical.push('Pembayaran '+pid+' menunjuk invoice yang tidak ada: '+bid);}else{if(String(b['ID Pelanggan'])!==String(p['ID Pelanggan']))critical.push('Mismatch ID pelanggan pada '+bid);if(Number(b.Nominal)!==Number(p.Nominal))critical.push('Mismatch nominal pada '+bid);if(String(b.Status)!=='Lunas')critical.push('Pembayaran '+pid+' menunjuk invoice yang belum Lunas: '+bid);if(nf&&String(nf.value).trim()){if(String(b.Nama)!==String(nf.value))warnings.push('Snapshot nama berbeda pada '+bid+': Tagihan="'+String(b.Nama)+'", Pembayaran="'+String(nf.value)+'"');}else{warnings.push('Pembayaran '+pid+' tidak memiliki nilai nama pelanggan pada field "'+(nf?nf.key:'tidak ditemukan')+'".');}}if(paymentByBill.has(bid))critical.push('Invoice memiliki lebih dari satu pembayaran: '+bid);paymentByBill.set(bid,p);}
for(const b of bills){if(String(b.Status)==='Lunas'&&!paymentByBill.has(String(b['ID Tagihan'])))critical.push('Invoice Lunas tanpa pembayaran: '+b['ID Tagihan']);}
const checks=[['Payment records',payments.length,'PASS'],['Unique payment IDs',paymentIds.size,paymentIds.size===payments.length?'PASS':'FAIL'],['Payments with existing invoice',payments.filter(p=>billById.has(String(p['ID Tagihan']))).length,payments.every(p=>billById.has(String(p['ID Tagihan'])))?'PASS':'FAIL'],['Invoices with max one payment',paymentByBill.size,payments.length===paymentByBill.size?'PASS':'FAIL'],['Critical integrity issues',critical.length,critical.length?'FAIL':'PASS'],['Name snapshot differences',warnings.length,warnings.length?'WARNING':'PASS']];
out.innerHTML=checks.map(x=>`<div class="card"><strong>${esc(x[0])}</strong><div>${esc(x[1])} — <span class="${x[2]==='PASS'?'pass':x[2]==='WARNING'?'warn':'fail'}">${x[2]}</span></div></div>`).join('')+`<div class="card"><strong>Critical details</strong><pre>${critical.length?esc(critical.join('\n')):'Tidak ditemukan masalah kritis.'}</pre></div><div class="card"><strong>Name field detected</strong><pre>${nameFields.size?esc(Array.from(nameFields).join(', ')):'Tidak ditemukan field nama.'}</pre></div><div class="card"><strong>Historical / snapshot warnings</strong><pre>${warnings.length?esc(warnings.join('\n')):'Tidak ada perbedaan/missing snapshot nama.'}</pre></div>`;
}catch(e){out.innerHTML='<div class="card"><span class="fail">ERROR</span><pre>'+esc(e.message)+'</pre></div>';}}document.getElementById('run').onclick=run;run();
</script></body></html>
