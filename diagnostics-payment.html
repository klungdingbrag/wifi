<!doctype html>
<html lang="id">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nusantara WiFi — Payment Integrity</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;color:#18212f;background:#f6f8fb}h1{margin-bottom:6px}.sub{color:#64748b;margin-top:0}.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:20px;margin:16px 0;box-shadow:0 4px 18px #00000008}.pass{color:#15803d;font-weight:700}.fail{color:#b91c1c;font-weight:700}.warn{color:#a16207;font-weight:700}button{border:0;border-radius:10px;padding:11px 16px;background:#172033;color:white;cursor:pointer}pre{white-space:pre-wrap;overflow:auto;background:#f8fafc;padding:14px;border-radius:10px}</style></head>
<body><h1>Payment Integrity Test</h1><p class="sub">Read-only. Tidak membuat, mengubah, atau menghapus transaksi.</p><button id="run">Jalankan pemeriksaan</button><div id="out"></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbw3xXv41xKe2L2rg3qIaXp_p5wzeSjvotCVrUMgT7SWJiDKBC4rv6DBLeHUkBRsYcQSZg/exec';
const out=document.getElementById('out');
async function get(action){const r=await fetch(API_URL+'?action='+encodeURIComponent(action),{cache:'no-store'});const t=await r.text();const j=JSON.parse(t);if(!r.ok||j.success===false)throw Error(j.message||'Request gagal');return j.data;}
function key(v){const m=String(v||'').match(/^(\\d{4})-(\\d{2})/);return m?m[1]+'-'+m[2]:String(v||'');}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function run(){out.innerHTML='<div class="card">Memeriksa...</div>';try{const d=await get('getInitialData');const customers=d.pelanggan||[],bills=d.tagihan||[],payments=d.pembayaran||[];const billById=new Map(bills.map(b=>[String(b['ID Tagihan']),b]));const paymentIds=new Set();const paymentByBill=new Map();const problems=[];
for(const p of payments){const pid=String(p['ID Pembayaran']||'');const bid=String(p['ID Tagihan']||'');if(!pid)problems.push('Pembayaran tanpa ID pembayaran.');if(paymentIds.has(pid))problems.push('Duplicate ID Pembayaran: '+pid);paymentIds.add(pid);if(!bid)problems.push('Pembayaran '+pid+' tanpa ID Tagihan.');const b=billById.get(bid);if(!b)problems.push('Pembayaran '+pid+' menunjuk invoice yang tidak ada: '+bid);else{if(String(b['ID Pelanggan'])!==String(p['ID Pelanggan']))problems.push('Mismatch pelanggan pada '+bid);if(String(b.Nama)!==String(p.Nama))problems.push('Mismatch nama pada '+bid);if(Number(b.Nominal)!==Number(p.Nominal))problems.push('Mismatch nominal pada '+bid);if(String(b.Status)!=='Lunas')problems.push('Pembayaran '+pid+' menunjuk invoice yang belum Lunas: '+bid);}if(paymentByBill.has(bid))problems.push('Invoice memiliki lebih dari satu pembayaran: '+bid);paymentByBill.set(bid,p);}
for(const b of bills){if(String(b.Status)==='Lunas'&&!paymentByBill.has(String(b['ID Tagihan'])))problems.push('Invoice Lunas tanpa pembayaran: '+b['ID Tagihan']);}
const result=[['Payment records',payments.length,'PASS'],['Unique payment IDs',paymentIds.size,'PASS'],['Payments with existing invoice',payments.filter(p=>billById.has(String(p['ID Tagihan']))).length,payments.every(p=>billById.has(String(p['ID Tagihan'])))?'PASS':'FAIL'],['Invoices with max one payment',paymentByBill.size,'PASS'],['Integrity issues',problems.length,problems.length?'FAIL':'PASS']];
out.innerHTML=result.map(x=>`<div class="card"><strong>${esc(x[0])}</strong><div>${esc(x[1])} — <span class="${x[2]==='PASS'?'pass':'fail'}">${x[2]}</span></div></div>`).join('')+`<div class="card"><strong>Detail</strong><pre>${problems.length?esc(problems.join('\\n')):'Tidak ditemukan masalah pada relasi Pembayaran ↔ Tagihan.'}</pre></div>`;
}catch(e){out.innerHTML='<div class="card"><span class="fail">ERROR</span><pre>'+esc(e.message)+'</pre></div>';}}
document.getElementById('run').onclick=run;run();
</script></body></html>
